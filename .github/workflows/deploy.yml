name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Schedule: 9 times per hour
#  schedule:
 #   - cron: '0,7,14,21,28,35,42,49,56 * * * *'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto site
        run: quarto render site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Build Astro (calculator)
        working-directory: astro
        run: |
          npm ci
          npm run build

      - name: Merge Astro into Quarto output (Quarto wins on conflicts)
        run: rsync -a --ignore-existing astro/dist/ site/_site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4